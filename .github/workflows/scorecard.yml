name: scorecard

on:
  push:
    branches: [main]
  schedule:
    # Weekly. The minute is off the hour because runs scheduled on the hour
    # wait in a longer queue.
    - cron: "41 9 * * 1"

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: analysis
    # publish_results sends a score to the Scorecard API under the running
    # repository's name. A fork must not publish one, so only this repository
    # runs the job.
    if: github.repository == 'saru-id/niwa'
    runs-on: ubuntu-24.04
    # No run of this scan is measured yet. Fifteen minutes is a ceiling that
    # stops a stuck job. The workflow runs after merge, so a low value blocks
    # no pull request.
    timeout-minutes: 15
    permissions:
      security-events: write # SARIF upload
      id-token: write # OIDC token that signs the published results
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # The Scorecard project scans public repositories weekly. Publishing
          # gives it this run instead. It is also what makes the score
          # readable over the project's public API.
          publish_results: true

      - name: Keep the results on the run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          # Five days is the window the action documents. The raw results stay
          # downloadable that long for anyone debugging a run.
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
