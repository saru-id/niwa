name: Improve the documentation
description: Report missing, unclear, or incorrect documentation.
title: "docs: "
labels:
  - documentation
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the open and closed issues for this documentation problem.
          required: true
  - type: input
    id: location
    attributes:
      label: Page or section
      description: Link the page or name the repository file and section.
      placeholder: https://niwa.rs/start/first-apply
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain what is missing, unclear, or incorrect.
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Suggested correction
      description: Describe the information or wording that would resolve the problem.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots or examples that show the documentation problem.
