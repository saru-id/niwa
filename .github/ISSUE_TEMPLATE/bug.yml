name: Report a bug
description: Report reproducible behavior that does not match niwa's contract.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Remove secrets and identifying machine data before submitting this form.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the open and closed issues for this problem.
          required: true
        - label: I removed credentials and identifying machine data from this report.
          required: true
  - type: input
    id: version
    attributes:
      label: niwa version
      description: Paste the output of `niwa --version`, or provide the commit hash.
      placeholder: niwa 0.1.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and architecture
      description: Include the macOS version and whether the Mac uses Apple silicon or Intel.
      placeholder: macOS 15.6, Apple silicon
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest config and exact commands that reproduce the problem.
      placeholder: |
        1. Create this config…
        2. Run this command…
        3. Observe this result…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe the result you expected and the contract that supports it.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Paste the complete output and describe the resulting machine state.
      render: shell
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add related configuration, screenshots, or details that narrow the cause.
