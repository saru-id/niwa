[package]
name = "niwa"
version = "0.1.2"
edition = "2024"
rust-version = "1.97"
description = "A configuration tool for macOS. One Luau script declares what a machine should be. niwa makes it true, shows its work, and can undo it."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
age = "0.12.1"
clap = { version = "4", features = ["derive"] }
jiff = "0.2.35"
mlua = { version = "0.12.0", features = ["luau"] }
plist = "1.10.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
similar = { version = "3.2.0", features = ["inline"] }
thiserror = "2"
toml = "1.1.4"
unicode-width = "0.2.2"

[dev-dependencies]
insta = { version = "1.48.0", features = ["filters"] }
proptest = "1.11.0"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
