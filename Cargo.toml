[package]
name = "niwa"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "A configuration tool for macOS. One Luau script declares what a machine should be. niwa makes it true, shows its work, and can undo it."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
