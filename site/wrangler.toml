name = "niwa-site"
main = "worker/index.ts"
compatibility_date = "2026-08-13"

# The tool sends nothing the user did not ask for, and neither does its build.
send_metrics = false

[assets]
directory = "./dist"
binding = "ASSETS"
# The Worker sees the apex and nothing else. Every other path, including
# /install.sh itself, is served straight from the asset store.
run_worker_first = ["/"]
# A path with no asset behind it gets the site's own 404 page. Without this
# the reader gets an empty body and no way back.
not_found_handling = "404-page"
