name = "niwa-site"
main = "worker/index.ts"
compatibility_date = "2026-08-15"

# The address, in the repository rather than in a dashboard.
#
# `custom_domain` makes the deploy itself bind niwa.rs to this Worker and
# write the DNS record for it, so the domain is part of the configuration
# that is reviewed and version controlled, and a fresh account reaches the
# same state from `wrangler deploy` alone. The zone was already on the
# account and carried no A, AAAA or CNAME at the apex — only mail hardening
# — so this record replaces nothing.
routes = [{ pattern = "niwa.rs", custom_domain = true }]

# The tool sends nothing the user did not ask for, and neither does its build.
send_metrics = false

[assets]
directory = "./dist"
binding = "ASSETS"
# The Worker sees the apex and the release paths, and nothing else. Every
# other path, including /install.sh itself, is served straight from the asset
# store. `/release/*` has no asset behind it, so it has to run first or
# `not_found_handling` would answer a download with the 404 page.
run_worker_first = ["/", "/release/*"]
# A path with no asset behind it gets the site's own 404 page. Without this
# the reader gets an empty body and no way back.
not_found_handling = "404-page"
